name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic settings so a test failure is never environmental.
  APP_ENV: test
  AUTH_SECRET: ci-only-secret-value-not-used-in-production-32
  DATABASE_URL: postgresql://leadforge:leadforge@localhost:5432/leadforge_test?schema=public
  REDIS_URL: redis://localhost:6379
  COOKIE_SECURE: 'false'

jobs:
  # Static checks run without services: fast feedback on the common failures.
  verify:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The API and worker compile against these, so they must build first.
      - name: Build packages
        run: |
          pnpm --filter @leadforge/database generate
          pnpm --filter @leadforge/config build
          pnpm --filter @leadforge/shared build
          pnpm --filter @leadforge/database build
          pnpm --filter @leadforge/ai build

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  # Migration validation catches a schema change shipped without a migration.
  migrations:
    name: Migration validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadforge
          POSTGRES_PASSWORD: leadforge
          POSTGRES_DB: leadforge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U leadforge"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter @leadforge/database exec prisma migrate deploy

      - name: Schema matches migrations
        # A non-empty diff means the schema was edited without a migration.
        run: |
          pnpm --filter @leadforge/database exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" \
            --exit-code && echo "Schema and migrations agree."

  e2e:
    name: End-to-end pipeline
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadforge
          POSTGRES_PASSWORD: leadforge
          POSTGRES_DB: leadforge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U leadforge"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          pnpm --filter @leadforge/database generate
          pnpm --filter @leadforge/config build
          pnpm --filter @leadforge/shared build
          pnpm --filter @leadforge/database build
          pnpm --filter @leadforge/ai build
          pnpm --filter @leadforge/api build
          pnpm --filter @leadforge/worker build

      - name: Migrate
        run: pnpm --filter @leadforge/database exec prisma migrate deploy

      - name: End-to-end tests
        run: pnpm --filter @leadforge/api test:e2e

      - name: Start API and worker
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          node apps/worker/dist/main.js > worker.log 2>&1 &
          npx --yes wait-on http://localhost:4000/health --timeout 60000

      - name: Smoke test
        run: node scripts/smoke-test.mjs http://localhost:4000

      - name: Service logs on failure
        if: failure()
        run: |
          echo '--- api ---'; tail -100 api.log || true
          echo '--- worker ---'; tail -100 worker.log || true

  build-web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: |
          pnpm --filter @leadforge/config build
          pnpm --filter @leadforge/shared build
      - name: Build web
        run: pnpm --filter @leadforge/web build

  images:
    name: Container images
    runs-on: ubuntu-latest
    # Images are only worth building once everything else is green.
    needs: [verify, migrations, e2e, build-web]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.service }}.Dockerfile
          # Not pushed here: wire up a registry and credentials to deploy.
          push: false
          tags: leadforge-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
