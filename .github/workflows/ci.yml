name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job builds the workspace packages first; apps import their compiled
  # output, not their source.
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Build, types, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma Client is generated code that typecheck and lint both depend on.
      - name: Generate Prisma Client
        run: pnpm --filter @leadforge/database exec prisma generate

      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

  test:
    name: Unit and E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadforge
          POSTGRES_PASSWORD: leadforge
          POSTGRES_DB: leadforge
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://leadforge:leadforge@localhost:5432/leadforge?schema=public
      REDIS_URL: redis://localhost:6379
      APP_ENV: test
      SESSION_SECRET: ci-session-secret-not-used-in-production-0123456789
      # The E2E suite must never reach a real provider: no key, AI disabled.
      AI_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter @leadforge/database exec prisma migrate deploy

      - run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: End-to-end tests against real Postgres
        run: pnpm test:e2e

  smoke:
    name: HTTP and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadforge
          POSTGRES_PASSWORD: leadforge
          POSTGRES_DB: leadforge
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://leadforge:leadforge@localhost:5432/leadforge?schema=public
      REDIS_URL: redis://localhost:6379
      APP_ENV: test
      SESSION_SECRET: ci-session-secret-not-used-in-production-0123456789
      AI_ENABLED: 'false'
      API_URL: http://localhost:4000
      WEB_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter @leadforge/database exec prisma migrate deploy

      - run: pnpm build

      - name: Start API and worker
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          node apps/worker/dist/main.js > /tmp/worker.log 2>&1 &
          # Poll rather than sleep a fixed amount: startup time varies with runner load.
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/health > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:4000/health

      - name: HTTP smoke
        run: node scripts/smoke-test.mjs

      - name: Start web
        run: |
          pnpm --filter @leadforge/web start > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/login > /dev/null && break
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:3000/login

      # The dashboard is client-rendered, so fetching HTML proves nothing.
      # This drives a real browser and asserts on what a user would see.
      - name: Browser smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/web-smoke.mjs

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: /tmp/*.log
          retention-days: 7

  model-registry:
    name: Model registry still resolves
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A retired model id does not fail at startup — it fails on the first real
    # call for whichever task routed to it. Only worth blocking main on.
    if: github.event_name != 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # No pnpm and no install: the script reads the registry file and calls a
      # public endpoint with the built-in fetch. Asking for a pnpm cache here
      # fails the job on cache-save, because nothing ever populated the store.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-models.mjs
