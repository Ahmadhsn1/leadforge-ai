name: Bug report
description: Something behaves differently from what it documents
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A reproduction beats a description. A failing test beats a reproduction.

        **Do not report security vulnerabilities here** — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest set of steps that reproduces it.
      placeholder: |
        1. Create a campaign with source `openstreetmap`
        2. Start it
        3. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Discovery (Places / OpenStreetMap)
        - Normalisation and dedupe
        - Verification / enrichment
        - AI gateway, routing or prompts
        - Scoring
        - Message generation or validation
        - Outreach, sequences or conversations
        - Web UI
        - Queues and workers
        - Deployment / configuration
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        Include the `requestId` or `jobId` if you have one — it threads through
        every log line for that operation. Redact secrets.
      render: text

  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: 'Node 20.11, pnpm 11.2, Windows 11 / Docker / native services'
