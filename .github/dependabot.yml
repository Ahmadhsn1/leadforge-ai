version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem rather than twenty: these move together and are
      # reviewed together.
      types:
        patterns: ['@types/*']
      linting:
        patterns: ['eslint*', '@typescript-eslint/*', 'prettier*']
      testing:
        patterns: ['vitest*', '@vitest/*', 'supertest', 'puppeteer*']
      nest:
        patterns: ['@nestjs/*']
      next:
        patterns: ['next', 'react', 'react-dom', '@tanstack/*']
    labels: ['dependencies']
    ignore:
      # Framework majors change behaviour that only the full suite can validate,
      # and an auto-opened PR for one sits red until somebody does that work.
      # They are tracked and upgraded deliberately instead.
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nestjs/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: 'zod'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ['dependencies', 'ci']
